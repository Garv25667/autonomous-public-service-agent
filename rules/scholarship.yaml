# Scholarship Eligibility Rules
# Source: National Student Scholarship Scheme (Demo Policy)

scheme_name: "National Student Scholarship Scheme"
version: "1.0"
authority: "Ministry of Education (Simulated)"
guidelines_source: "https://scholarships.gov.in/demo-guidelines"

rules:
  income_ceiling: 800000.0          # Max annual income: ₹8,00,000
  min_marks_percentage: 60.0        # Minimum previous exam percentage: 60%
  max_age_years: 26                 # Maximum age at application time: 26 years
  allowed_categories:
    - "General"
    - "OBC"
    - "SC"
    - "ST"
    - "EWS"
  allowed_courses:
    - "B.Tech"
    - "B.Sc"
    - "B.Com"
    - "B.A."
    - "M.Tech"
    - "M.Sc"
    - "MBA"
    - "Diploma"
  required_documents:
    - name: "marksheet"
      allowed_formats: [".pdf", ".jpg", ".jpeg", ".png"]
      max_size_mb: 2.0
